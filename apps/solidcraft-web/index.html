<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>SolidCraft</title>
  <meta name="description" content="Open-source parametric CAD built in Rust. Desktop, browser, and MCP for AI agents.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SolidCraft">
  <meta property="og:title" content="SolidCraft: try it in your browser">
  <meta property="og:description" content="Open-source parametric CAD built in Rust. Desktop, browser, and MCP for AI agents.">
  <meta property="og:url" content="https://bherbruck.github.io/solidcraft/app/">
  <meta property="og:image" content="https://bherbruck.github.io/solidcraft/og.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="SolidCraft: open-source parametric CAD built in Rust">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SolidCraft: try it in your browser">
  <meta name="twitter:description" content="Open-source parametric CAD built in Rust. Desktop, browser, and MCP for AI agents.">
  <meta name="twitter:image" content="https://bherbruck.github.io/solidcraft/og.png">
  <meta name="twitter:image:alt" content="SolidCraft: open-source parametric CAD built in Rust">
  <!-- data-wasm-opt is 0 (no wasm-opt pass): the binaryen trunk bundles rejects the
       saturating float-to-int conversions the current Rust toolchain emits
       ("all used features should be allowed" on i32.trunc_sat_f32_u). Shipping an
       unoptimised wasm beats shipping no browser build; bump trunk/binaryen and put the
       optimisation back once its validator accepts them. -->
  <link data-trunk rel="rust" data-bin="solidcraft-web" data-wasm-opt="0" data-weak-refs />
  <link data-trunk rel="copy-file" href="../../assets/fonts/biz-udp-gothic/BIZUDPGothic-Regular.ttf" data-target-path="fonts" />
  <link data-trunk rel="copy-file" href="../../assets/fonts/biz-udp-gothic/OFL.txt" data-target-path="fonts" />
  <link data-trunk rel="css" href="../../assets/styles/web/loading.css" />
</head>
<body>
  <canvas id="solidcraft_canvas"></canvas>
  <div id="solidcraft_loading">Loading SolidCraft&hellip;</div>
  <script>
    // Offline use and updates (sw.js; written into release builds by `cargo xtask web-offline`).
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
